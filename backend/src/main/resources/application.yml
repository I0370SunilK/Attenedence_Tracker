# MongoDB Atlas is the ONLY database. Set MONGODB_URI in .env (see project root .env.example).
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

server:
  port: 8080

app:
  name: Attendance Tracker
  mongodb:
    required-host: cluster0.ivqu5bo.mongodb.net
    database: attendance_tracker
  admin:
    employee-id: ${ADMIN_EMPLOYEE_ID:Admin323}
    password: ${ADMIN_PASSWORD:Admin@srmtech25}
    recovery-email: ${ADMIN_RECOVERY_EMAIL:karivilla.sunil@srmtech.com}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  session:
    cookie-name: att_session_uid
    max-age: 86400
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-number: true
    require-special-char: true
  email:
    domain: srmtech.com

logging:
  level:
    root: INFO
    attendance.example.backend: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: INFO
