# ============================================
# SRM Attendance Tracker - Nginx Configuration
# Serves React SPA + Proxies /api/* to Spring Boot
# ${PORT} substituted at runtime via envsubst
# ============================================

# Upstream backend service
upstream backend {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;
    charset utf-8;

    # Performance: client timeouts
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json 
               image/svg+xml;
    gzip_disable "msie6";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ===== API Proxy to Spring Boot =====
    location /api/ {
        proxy_pass http://backend;
        
        # Headers for proper request forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        
        # Performance tuning
        proxy_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
    }

    # ===== Static Assets (Frontend) =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== React SPA Root =====
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ===== React SPA Fallback =====
    location / {
        # Try file, then directory, then fallback to index.html for SPA
        try_files $uri $uri/ /index.html;
        
        # Don't cache the main index.html
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ===== Health Check Endpoint =====
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type "text/plain";
    }

    # ===== Deny Hidden Files =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== Deny Config Files =====
    location ~ \.conf$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}