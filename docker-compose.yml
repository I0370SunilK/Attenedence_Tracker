# ============================================
# SRM Attendance Tracker - Docker Compose
# Local Development Configuration
# ============================================
services:
  # MongoDB Atlas ONLY — requires MONGODB_URI in .env (cluster0.ivqu5bo.mongodb.net)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""  # Empty = use relative URLs through Nginx proxy
    container_name: srm-attendance-tracker
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_URI=${MONGODB_URI}
      - ADMIN_EMPLOYEE_ID=${ADMIN_EMPLOYEE_ID:-Admin323}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@srmtech25}
      - ADMIN_RECOVERY_EMAIL=${ADMIN_RECOVERY_EMAIL:-karivilla.sunil@srmtech.com}
      - EMPLOYEE_DEFAULT_PASSWORD=${EMPLOYEE_DEFAULT_PASSWORD:-Welcome@123}
    restart: unless-stopped
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
